<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALLCON - Supplier Directory</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23ef4444' d='M501.1 395.7L384 278.6c-4.5-4.5-10.6-7-17-7h-14.1l-24.8-24.8c42.7-56.4 39.4-136.5-10.4-189.2-56.7-60.1-152-61.9-211-.9l81.3 81.3c9.4 9.4 9.4 24.6 0 33.9l-33.9 33.9c-9.4 9.4-24.6 9.4-33.9 0L39.1 124.6c-61 59-59.2 154.3.9 211 52.8 49.8 132.8 53.1 189.2 10.4l24.8 24.8v14.1c0 6.4 2.5 12.5 7 17l117.1 117.1c14.6 14.6 38.2 14.6 52.8 0l50.3-50.3c14.6-14.7 14.6-38.4 0-53z'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    html.dark, html.dark body {
      background-color: #0b0b0c !important;
      color: #f4f4f5 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html.dark input, html.dark select, html.dark textarea {
      background-color: #27272a !important;
      color: #ffffff !important;
      border-color: #3f3f46 !important;
    }
    html.dark input:focus, html.dark select:focus, html.dark textarea:focus {
      outline: none;
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 1px #ef4444;
    }
  </style>
</head>
<body class="bg-[#0b0b0c] text-zinc-100 font-sans min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-[#121215] text-white shadow-lg border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <div class="bg-white p-1 rounded flex items-center justify-center h-10 min-w-[110px]">
          <img src="./ALLCON-Logo.jpg" alt="ALLCON Logo" class="h-8 w-auto object-contain" onerror="this.onerror=null; this.outerHTML='<div class=\'bg-red-600 text-white font-black px-2.5 py-0.5 rounded text-lg tracking-wider\'>ALLCON</div>';">
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            Supplier Directory <span class="text-xs bg-red-600 text-white font-semibold px-2 py-0.5 rounded-full uppercase tracking-wider">Live Sync</span>
          </h1>
        </div>
      </div>
      <div class="flex items-center gap-3 text-xs font-semibold text-zinc-400">
        <span class="inline-flex items-center gap-1.5 bg-[#18181b] px-3.5 py-2 rounded-xl border border-zinc-800 text-emerald-400">
          <i class="fa-solid fa-arrows-rotate text-[10px] fa-spin"></i> Google Sheets Connected
        </span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full">
    <section id="view-suppliers">
      <div class="bg-[#18181b] p-4 rounded-xl border border-zinc-800 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
        <div class="w-full md:w-1/2 relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-zinc-500"></i>
          <input type="text" id="supplier-search" onkeyup="renderSuppliers()" placeholder="Search suppliers by name, category, services, or contact person..." class="w-full pl-9 pr-4 py-2 rounded-lg text-sm border border-zinc-800 bg-[#27272a] text-white">
        </div>
        <div class="flex items-center gap-3 w-full md:w-auto justify-end">
          <div class="text-xs text-zinc-400 font-semibold" id="supplier-count">Loading Suppliers...</div>
          <button onclick="expandAllSuppliers()" class="text-xs bg-[#27272a] hover:bg-zinc-700 text-white px-3 py-1.5 rounded-lg font-semibold transition">Expand All</button>
          <button onclick="collapseAllSuppliers()" class="text-xs bg-[#27272a] hover:bg-zinc-700 text-white px-3 py-1.5 rounded-lg font-semibold transition">Collapse All</button>
          <button onclick="openSupplierModal('add')" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3.5 py-1.5 rounded-lg font-bold transition flex items-center gap-1.5 shadow">
            <i class="fa-solid fa-plus text-[10px]"></i> Add Supplier
          </button>
        </div>
      </div>

      <div id="suppliers-list-container" class="space-y-6">
        <div class="text-center p-8 text-zinc-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Fetching Live Supplier Data...</div>
      </div>
    </section>
  </main>

  <!-- SUPPLIER MODAL (ADD / EDIT) -->
  <div id="supplier-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-[#18181b] border border-zinc-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative my-8">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-4 mb-6">
        <div>
          <h2 id="modal-title" class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-truck-field text-red-500"></i> Submit New Supplier
          </h2>
          <p class="text-xs text-zinc-400">Complete the form fields below to sync changes directly with Google Sheets.</p>
        </div>
        <button onclick="closeSupplierModal()" class="text-zinc-400 hover:text-white text-lg p-1"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="supplier-form" onsubmit="handleSupplierSubmit(event)" class="space-y-4 text-xs">
        <input type="hidden" id="form-action" value="add">
        <input type="hidden" id="original-supplier-name" value="">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-zinc-300 mb-1">STATUS</label>
            <select id="field-status" required class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
              <option value="PREFERRED">PREFERRED</option>
              <option value="APPROVED" selected>APPROVED</option>
              <option value="REJECTED">REJECTED</option>
              <option value="NO STATUS">NO STATUS</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-zinc-300 mb-1">SUPPLIER NAME</label>
            <input type="text" id="field-supplier-name" required placeholder="Company Name" class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
          </div>
          <div>
            <label class="block font-bold text-zinc-300 mb-1">CATEGORY</label>
            <input type="text" id="field-category" placeholder="e.g. Steel Fabrication" class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
          </div>
          <div>
            <label class="block font-bold text-zinc-300 mb-1">POC NAME</label>
            <input type="text" id="field-poc-name" placeholder="Contact Person" class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
          </div>
          <div>
            <label class="block font-bold text-zinc-300 mb-1">POC EMAIL</label>
            <input type="email" id="field-poc-email" placeholder="name@supplier.com" class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
          </div>
          <div>
            <label class="block font-bold text-zinc-300 mb-1">POC PHONE</label>
            <input type="tel" id="field-poc-phone" placeholder="+27 ..." class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
          </div>
        </div>
        <div>
          <label class="block font-bold text-zinc-300 mb-1">SERVICES OFFERED</label>
          <input type="text" id="field-services" placeholder="Services offered..." class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block font-bold text-zinc-300 mb-1">LOGISTICS</label>
            <select id="field-logistics" class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
              <option value="COLLECTION">COLLECTION</option>
              <option value="DELIVERY">DELIVERY</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-zinc-300 mb-1">PAYMENT TERMS</label>
            <select id="field-payment-terms" class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
              <option value="30 DAY ACCOUNT">30 DAY ACCOUNT</option>
              <option value="COD">COD</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-zinc-300 mb-1">STANDARD ETA</label>
            <input type="text" id="field-standard-eta" placeholder="e.g. 3-5 Working Days" class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
          </div>
        </div>
        <div>
          <label class="block font-bold text-zinc-300 mb-1">ADDRESS</label>
          <input type="text" id="field-address" placeholder="Physical Address" class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white">
        </div>
        <div>
          <label class="block font-bold text-zinc-300 mb-1">NOTES</label>
          <textarea id="field-notes" rows="2" placeholder="Comments..." class="w-full p-2.5 rounded-lg border border-zinc-800 bg-[#27272a] text-white"></textarea>
        </div>
        <div class="pt-4 border-t border-zinc-800 flex justify-end gap-3">
          <button type="button" onclick="closeSupplierModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white font-semibold rounded-lg transition">Cancel</button>
          <button type="submit" id="submit-supplier-btn" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition shadow flex items-center gap-2">
            <i class="fa-solid fa-paper-plane text-xs"></i> Save Supplier
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2VEQ5anPd57W5qMZaHmR9UENJj9MpB2zY8uaoe3IMTxb8f82wsyOEy2S9WmZWX4Q9/exec";

    let liveSupplierData = [];
    let collapsedSuppliers = {};

    async function loadSuppliersData() {
      try {
        const response = await fetch(GOOGLE_APPS_SCRIPT_URL);
        const json = await response.json();
        const suppRaw = json.suppliers || [];

        liveSupplierData = suppRaw.map(r => ({
          status: r['STATUS'] || r['status'] || 'APPROVED',
          supplierName: r['SUPPLIER NAME'] || r['supplierName'] || '',
          category: r['CATEGORY'] || r['category'] || '',
          pocName: r['POC NAME'] || r['pocName'] || '',
          pocEmail: r['POC EMAIL'] || r['pocEmail'] || '',
          pocPhone: r['POC PHONE'] || r['pocPhone'] || '',
          servicesOffered: r['SERVICES OFFERED'] || r['servicesOffered'] || '',
          logistics: r['LOGISTICS'] || r['logistics'] || '',
          paymentTerms: r['PAYMENT TERMS'] || r['paymentTerms'] || '',
          standardEta: r['STANDARD ETA'] || r['standardEta'] || '',
          address: r['ADDRESS'] || r['address'] || '',
          notes: r['NOTES'] || r['notes'] || ''
        }));

        const uniqueLetters = new Set(liveSupplierData.map(s => {
          const name = s.supplierName || '';
          const firstLetter = name.charAt(0).toUpperCase();
          return /[A-Z]/.test(firstLetter) ? firstLetter : '#';
        }));
        uniqueLetters.forEach(l => { collapsedSuppliers[l] = true; });

        renderSuppliers();
      } catch (err) {
        console.error("Failed to load data:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", loadSuppliersData);

    function getStatusBadgeClass(status) {
      const clean = (status || '').toUpperCase().trim();
      switch (clean) {
        case 'APPROVED': return 'bg-blue-600';
        case 'PREFERRED': return 'bg-emerald-600';
        case 'REJECTED': return 'bg-red-600';
        default: return 'bg-zinc-600';
      }
    }

    function toggleSupplierGroup(letter) {
      collapsedSuppliers[letter] = !collapsedSuppliers[letter];
      renderSuppliers();
    }

    function expandAllSuppliers() {
      Object.keys(collapsedSuppliers).forEach(l => { collapsedSuppliers[l] = false; });
      renderSuppliers();
    }

    function collapseAllSuppliers() {
      Object.keys(collapsedSuppliers).forEach(l => { collapsedSuppliers[l] = true; });
      renderSuppliers();
    }

    function openSupplierModal(mode, supplierName = '') {
      const modal = document.getElementById('supplier-modal');
      const form = document.getElementById('supplier-form');
      form.reset();

      if (mode === 'edit') {
        const item = liveSupplierData.find(s => s.supplierName === supplierName);
        if (!item) return;

        document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-red-500"></i> Edit Supplier: ${item.supplierName}`;
        document.getElementById('form-action').value = 'edit';
        document.getElementById('original-supplier-name').value = item.supplierName;

        document.getElementById('field-status').value = item.status || 'APPROVED';
        document.getElementById('field-supplier-name').value = item.supplierName || '';
        document.getElementById('field-category').value = item.category || '';
        document.getElementById('field-poc-name').value = item.pocName || '';
        document.getElementById('field-poc-email').value = item.pocEmail || '';
        document.getElementById('field-poc-phone').value = item.pocPhone || '';
        document.getElementById('field-services').value = item.servicesOffered || '';
        document.getElementById('field-logistics').value = item.logistics || 'COLLECTION';
        document.getElementById('field-payment-terms').value = item.paymentTerms || '30 DAY ACCOUNT';
        document.getElementById('field-standard-eta').value = item.standardEta || '';
        document.getElementById('field-address').value = item.address || '';
        document.getElementById('field-notes').value = item.notes || '';
      } else {
        document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-truck-field text-red-500"></i> Submit New Supplier`;
        document.getElementById('form-action').value = 'add';
        document.getElementById('original-supplier-name').value = '';
      }

      modal.classList.remove('hidden');
    }

    function closeSupplierModal() {
      document.getElementById('supplier-modal').classList.add('hidden');
    }

    async function handleSupplierSubmit(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submit-supplier-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> Saving to Sheet...`;

      const action = document.getElementById('form-action').value;
      const originalName = document.getElementById('original-supplier-name').value;

      const payload = {
        action: action,
        originalSupplierName: originalName,
        status: document.getElementById('field-status').value,
        supplierName: document.getElementById('field-supplier-name').value,
        category: document.getElementById('field-category').value,
        pocName: document.getElementById('field-poc-name').value,
        pocEmail: document.getElementById('field-poc-email').value,
        pocPhone: document.getElementById('field-poc-phone').value,
        servicesOffered: document.getElementById('field-services').value,
        logistics: document.getElementById('field-logistics').value,
        paymentTerms: document.getElementById('field-payment-terms').value,
        standardEta: document.getElementById('field-standard-eta').value,
        address: document.getElementById('field-address').value,
        notes: document.getElementById('field-notes').value
      };

      try {
        await fetch(GOOGLE_APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (action === 'edit') {
          const idx = liveSupplierData.findIndex(s => s.supplierName === originalName);
          if (idx !== -1) liveSupplierData[idx] = payload;
        } else {
          liveSupplierData.unshift(payload);
        }

        closeSupplierModal();
        renderSuppliers();
      } catch (err) {
        console.error("Save error:", err);
        alert("Error updating sheet.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane text-xs"></i> Save Supplier`;
      }
    }

    function renderSuppliers() {
      const query = (document.getElementById('supplier-search')?.value || '').toLowerCase();
      const container = document.getElementById('suppliers-list-container');
      
      const filtered = liveSupplierData.filter(s => 
        (s.supplierName || '').toLowerCase().includes(query) ||
        (s.category || '').toLowerCase().includes(query) ||
        (s.pocName || '').toLowerCase().includes(query) ||
        (s.servicesOffered || '').toLowerCase().includes(query)
      );

      document.getElementById('supplier-count').innerText = `Showing ${filtered.length} Suppliers`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center p-8 bg-[#18181b] border border-zinc-800 rounded-xl text-zinc-400">No suppliers found.</div>`;
        return;
      }

      filtered.sort((a, b) => (a.supplierName || '').localeCompare(b.supplierName || ''));

      const groups = {};
      filtered.forEach(s => {
        const letter = (s.supplierName.charAt(0) || '').toUpperCase();
        const key = /[A-Z]/.test(letter) ? letter : '#';
        if (!groups[key]) groups[key] = [];
        groups[key].push(s);
      });

      const sortedKeys = Object.keys(groups).sort((a, b) => a === '#' ? 1 : b === '#' ? -1 : a.localeCompare(b));

      container.innerHTML = sortedKeys.map(letter => {
        const suppliersInGroup = groups[letter];
        const isCollapsed = query ? false : (collapsedSuppliers[letter] !== false);

        const cardsHtml = suppliersInGroup.map(s => {
          const badgeClass = getStatusBadgeClass(s.status);
          const safeName = s.supplierName.replace(/'/g, "\\'");
          return `
            <div class="bg-[#18181b] border border-zinc-800 rounded-xl p-5 shadow-sm hover:border-zinc-700 transition relative group">
              <div class="flex justify-between items-start mb-3">
                <div>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded text-white ${badgeClass}">${s.status || 'N/A'}</span>
                  <h3 class="text-base font-bold mt-1 text-white">${s.supplierName}</h3>
                  <p class="text-xs text-red-500 font-semibold">${s.category || 'Uncategorized'}</p>
                </div>
                <button onclick="openSupplierModal('edit', '${safeName}')" class="text-xs bg-[#27272a] hover:bg-red-600 text-zinc-300 hover:text-white px-2.5 py-1 rounded border border-zinc-700 transition flex items-center gap-1">
                  <i class="fa-solid fa-pen text-[10px]"></i> Edit
                </button>
              </div>
              <div class="grid grid-cols-1 gap-1.5 text-xs text-zinc-300 my-3 bg-[#27272a] p-3 rounded-lg border border-zinc-800">
                ${s.pocName ? `<div><strong>POC Name:</strong> ${s.pocName}</div>` : ''}
                ${s.pocEmail ? `<div><strong>POC Email:</strong> <a href="mailto:${s.pocEmail}" class="text-red-400 hover:underline">${s.pocEmail}</a></div>` : ''}
                ${s.pocPhone ? `<div><strong>POC Phone:</strong> <a href="tel:${s.pocPhone}" class="text-red-400 hover:underline">${s.pocPhone}</a></div>` : ''}
                ${s.servicesOffered ? `<div><strong>Services Offered:</strong> ${s.servicesOffered}</div>` : ''}
                ${s.logistics ? `<div><strong>Logistics:</strong> ${s.logistics}</div>` : ''}
                ${s.paymentTerms ? `<div><strong>Payment Terms:</strong> ${s.paymentTerms}</div>` : ''}
                ${s.standardEta ? `<div><strong>Standard ETA:</strong> ${s.standardEta}</div>` : ''}
                ${s.address ? `<div><strong>Address:</strong> ${s.address}</div>` : ''}
                ${s.notes ? `<div class="pt-1.5 border-t border-zinc-700/60 mt-1.5 text-zinc-400 italic"><strong>Notes:</strong> ${s.notes}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="border border-zinc-800 rounded-xl bg-[#18181b] overflow-hidden shadow-sm">
            <div onclick="toggleSupplierGroup('${letter}')" class="flex items-center gap-3 p-4 cursor-pointer hover:bg-zinc-800/60 transition select-none">
              <span class="w-8 h-8 rounded-lg bg-red-600 text-white font-black text-sm flex items-center justify-center shadow">${letter}</span>
              <div class="flex-grow border-t border-zinc-800"></div>
              <span class="text-xs font-semibold text-zinc-400">${suppliersInGroup.length} supplier${suppliersInGroup.length === 1 ? '' : 's'}</span>
              <i class="fa-solid ${isCollapsed ? 'fa-chevron-right' : 'fa-chevron-down'} text-zinc-400 text-xs ml-2 w-4 text-center"></i>
            </div>
            <div class="${isCollapsed ? 'hidden' : 'grid'} grid-cols-1 md:grid-cols-2 gap-4 p-4 pt-0">
              ${cardsHtml}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
